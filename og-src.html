<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amita&family=Suranna&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:
      radial-gradient(120% 80% at 50% -10%, #5c1628 0%, transparent 58%),
      radial-gradient(90% 50% at 50% 115%, rgba(216,116,141,.18) 0%, transparent 66%),
      #2E0A15;
    position: relative;
  }
  .jaali { position:absolute; inset:0; opacity:.8; }
  .medal { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:760px; opacity:.5; }
  .inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .shloka { font-family:'Tiro Devanagari Hindi',serif; color:rgba(214,154,69,.85); font-size:22px; letter-spacing:.06em; margin-bottom:18px; }
  .eyebrow { font-family:'Suranna',serif; color:rgba(246,232,210,.75); font-size:19px; letter-spacing:.34em; text-transform:uppercase; text-indent:.34em; margin-bottom:14px; }
  .names { font-family:'Amita',cursive; font-size:118px; line-height:1.05; color:#F0C7B7; text-shadow:0 4px 40px rgba(216,116,141,.4); }
  .rule { display:flex; align-items:center; gap:14px; margin:20px 0 16px; }
  .rule i { width:150px; height:1px; background:linear-gradient(90deg, transparent, rgba(214,154,69,.8)); }
  .rule i:last-child { background:linear-gradient(90deg, rgba(214,154,69,.8), transparent); }
  .rule svg { width:26px; height:26px; }
  .date { font-family:'Suranna',serif; color:#D69A45; font-size:34px; letter-spacing:.2em; }
  .venue { font-family:'Suranna',serif; color:rgba(246,232,210,.65); font-size:19px; letter-spacing:.12em; margin-top:10px; }
  .canopy { position:absolute; top:-2%; left:-3%; width:106%; height:175px; object-fit:cover; object-position:top center; -webkit-mask-image:linear-gradient(180deg,#000 58%,transparent 96%); mask-image:linear-gradient(180deg,#000 58%,transparent 96%); }
  .sprig-bl, .sprig-br { position:absolute; bottom:-14px; width:clamp(150px, 17vw, 210px); height:auto; }
  .sprig-bl { left:-16px; transform:scaleY(-1) rotate(8deg); }
  .sprig-br { right:-16px; transform:scaleY(-1) scaleX(-1) rotate(8deg); }
</style>
</head>
<body>
<svg class="jaali" width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <circle r="260" fill="none" stroke="#D69A45" stroke-opacity=".3" stroke-width="1"/>

      <path d="M0 -315 C 14 -298 16 -284 8 -270 C 3 -262 -3 -262 -8 -270 C -16 -284 -14 -298 0 -315 Z" transform="rotate(330)"/>
    </g>
    <g fill="#D69A45" fill-opacity=".55">
      <circle cx="0" cy="-286" r="2.4"/><circle cx="143" cy="-247.7" r="2.4"/><circle cx="247.7" cy="-143" r="2.4"/>
      <circle cx="286" cy="0" r="2.4"/><circle cx="247.7" cy="143" r="2.4"/><circle cx="143" cy="247.7" r="2.4"/>
      <circle cx="0" cy="286" r="2.4"/><circle cx="-143" cy="247.7" r="2.4"/><circle cx="-247.7" cy="143" r="2.4"/>
      <circle cx="-286" cy="0" r="2.4"/><circle cx="-247.7" cy="-143" r="2.4"/><circle cx="-143" cy="-247.7" r="2.4"/>
    </g>
  </g>
</svg>

<img class="canopy" src="assets/art/garland-swag.webp" alt="" aria-hidden="true">

</body>
</html>

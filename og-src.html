<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }

      radial-gradient(120% 80% at 50% -10%, #5c1628 0%, transparent 58%),

      #2E0A15;
    position: relative;
  }
  .jaali { position:absolute; inset:0; opacity:.8; }
  .medal { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:760px; opacity:.5; }
  .inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .shloka { font-family:'Tiro Devanagari Hindi',serif; color:rgba(214,154,69,.85); font-size:22px; letter-spacing:.06em; margin-bottom:18px; }
  .eyebrow { font-family:'Suranna',serif; color:rgba(246,232,210,.75); font-size:19px; letter-spacing:.34em; text-transform:uppercase; text-indent:.34em; margin-bottom:14px; }
  .names { font-family:'Amita',cursive; font-size:118px; line-height:1.05; color:#F0C7B7; text-shadow:0 4px 40px rgba(216,116,141,.4); }
  .rule { display:flex; align-items:center; gap:14px; margin:20px 0 16px; }
  .rule i { width:150px; height:1px; background:linear-gradient(90deg, transparent, rgba(214,154,69,.8)); }
  .rule i:last-child { background:linear-gradient(90deg, rgba(214,154,69,.8), transparent); }
  .rule svg { width:26px; height:26px; }
  .date { font-family:'Suranna',serif; color:#D69A45; font-size:34px; letter-spacing:.2em; }
  .venue { font-family:'Suranna',serif; color:rgba(246,232,210,.65); font-size:19px; letter-spacing:.12em; margin-top:10px; }
  .canopy { position:absolute; top:0; left:0; width:100%; }
  .swags { position:absolute; bottom:-6px; left:0; width:100%; }
</style>
